<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later — icône Suivi Loyers -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#1257d6"/>
    </linearGradient>
    <linearGradient id="papier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="vert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37d67a"/>
      <stop offset="1" stop-color="#16a557"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a2a6b" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- carré arrondi façon macOS (marge de la grille Apple : 100 px) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fond)"/>
  <!-- maison -->
  <g filter="url(#ombre)">
    <path d="M512 232 L790 470 Q806 484 790 498 L760 498 L760 760 Q760 790 730 790 L294 790 Q264 790 264 760 L264 498 L234 498 Q218 484 234 470 Z"
          fill="url(#papier)"/>
  </g>
  <!-- quittance dans la maison -->
  <rect x="392" y="470" width="240" height="250" rx="22" fill="#ffffff" stroke="#c9d5ea" stroke-width="6"/>
  <rect x="428" y="516" width="168" height="20" rx="10" fill="#9fb3d6"/>
  <rect x="428" y="566" width="128" height="16" rx="8" fill="#c9d5ea"/>
  <rect x="428" y="604" width="150" height="16" rx="8" fill="#c9d5ea"/>
  <text x="512" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="74" fill="#1a5fd8">€</text>
  <!-- pastille « payé » -->
  <g filter="url(#ombre)">
    <circle cx="742" cy="742" r="132" fill="url(#vert)" stroke="#ffffff" stroke-width="16"/>
  </g>
  <path d="M680 744 L724 788 L808 698" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
